name: Verify notebooks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    # A wrong solution can loop forever instead of failing an assert. Without a
    # cap that hangs the runner until GitHub's own six-hour limit kills it.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        # ruff is pinned: an unpinned linter installs whatever shipped most
        # recently, so whether the build is green depends on the date it ran.
        run: pip install -r requirements.txt ruff==0.16.3

      - name: Lint the verification scripts
        run: ruff check .

      - name: Run every notebook cell and check its asserts
        run: python verify_notebooks.py

      - name: Check a sample of solutions against independent references
        run: python stress_test.py

      - name: Check the README's numbers against the notebooks
        run: python check_claims.py
